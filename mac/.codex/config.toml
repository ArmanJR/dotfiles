model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
suppress_unstable_features_warning = true
service_tier = "default"

[features]
prevent_idle_sleep = true

[tui]
status_line = ["current-dir", "model-with-reasoning", "git-branch", "branch-changes", "run-state", "context-used"]
status_line_use_colors = false
pet = "seedy"
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 1
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[plugins."github@openai-curated"]
enabled = true

[plugins."safety-net@cc-marketplace"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--autoConnect"]

[mcp_servers.chrome-devtools.tools.get_network_request]
approval_mode = "approve"
